<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <title>Document</title>
</head>

<body>
    <h1 class="text-center mt-5"> Calculator</h1>


    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <input type="number" id="num1" placeholder="Enter first number" class="form-control">
            </div>
            <div class="col-1">
                <select name="" id="opt">
                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">*</option>
                    <option value="/">/</option>
                </select>
            </div>
            <div class="col-md-4">
                <input type="number" id="num2" placeholder="Enter second number" class="form-control">
            </div>
            <div class="col-md-3">
                <button onclick="calculate()" class="btn btn-primary btn-block">Calculate</button>
            </div>

            <div class="col-12">
                <center>
                    <h1>Result: <span id="result"></span></h1>
                </center>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            let num1 = document.getElementById('num1').value;
            let num2 = document.getElementById('num2').value;

            let opt = document.getElementById('opt').value;
           
            if(opt == '+'){
                result = parseInt(num1) + parseInt(num2) 
            }

             if(opt == '-'){
                result = parseInt(num1) - parseInt(num2) 
            }

             if(opt == '/'){
                result = parseInt(num1) / parseInt(num2) 
            }

             if(opt == '*'){
                result = parseInt(num1) * parseInt(num2) 
            }













            document.getElementById('result').innerHTML = result



        }
    </script>

</body>
