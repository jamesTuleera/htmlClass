<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div class="carousel">
        <img src="" alt="" id="slides">
    </div>




    
<script>

let count = 0

    setInterval(()=>{
        
        count++
        document.getElementById('slides').src = `images/${count}.png`
    }, 3000)
</script>


</body>
</html>
